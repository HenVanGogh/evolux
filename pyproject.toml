[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evolux"
version = "0.1.0.dev0"
description = "GPU-native modular framework for simulated evolution of intelligent creatures"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "HenVanGogh" }]
keywords = ["evolution", "neural-networks", "simulation", "neat", "world-models", "mamba", "transformer", "map-elites"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Core runtime — kept slim. Heavy/optional deps live in extras.
dependencies = [
    "torch>=2.3",
    "numpy>=1.26",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "rich>=13.7",
    "typer>=0.12",
    "einops>=0.8",
]

[project.optional-dependencies]
# Distributed training / cloud
distributed = [
    "ray[default]>=2.10",
    "pyarrow>=15.0",
]
# Memory: vector retrieval
retrieval = [
    "faiss-cpu>=1.8",
]
# Visualisation / logging sinks
viz = [
    "tensorboard>=2.16",
    "wandb>=0.17",
    "matplotlib>=3.8",
    "pillow>=10.3",
    "imageio>=2.34",
    "imageio-ffmpeg>=0.5",
]
# Web dashboard
web = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12.0",
]
# Development
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "pytest-benchmark>=4.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "hypothesis>=6.100",
]
all = ["evolux[distributed,retrieval,viz,web,dev]"]

[project.scripts]
evolux = "evolux.orchestrator.cli:app"

[project.urls]
Homepage = "https://github.com/HenVanGogh/evolux"
Issues = "https://github.com/HenVanGogh/evolux/issues"
Documentation = "https://github.com/HenVanGogh/evolux/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]
include = ["evolux*"]

[tool.setuptools.package-data]
evolux = ["**/SPEC.md", "py.typed"]
